name: sawa
description: "Botim-like chat and calling app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebRTC
  flutter_webrtc: ^1.4.1

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Signaling
  socket_io_client: ^3.1.4

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.2.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Freezed
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Navigation
  go_router: ^17.2.2

  # DI
  get_it: ^9.2.1
  injectable: ^3.0.0

  # UI / UX
  flutter_easyloading: ^3.0.5
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utils
  permission_handler: ^12.0.1
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.5
  injectable_generator: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#5B4FD4"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/