<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D33A8"/>
      <stop offset="100%" stop-color="#5B4FD4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect x="14" y="14" width="996" height="996" rx="210" ry="210" fill="none" stroke="#4A3EC0" stroke-width="6" opacity="0.35"/>

  <!-- LEFT purple bubble (behind) -->
  <g>
    <path d="M240,310 h260 q36,0 36,36 v150 q0,36 -36,36 h-200 l-50,55 l10,-55 h-20 q-36,0 -36,-36 v-150 q0,-36 36,-36 z" fill="#7B6FE8" opacity="0.82"/>
    <!-- س in teal color, large and centered -->
    <text x="370" y="440" text-anchor="middle" dominant-baseline="central"
          font-family="'Geeza Pro', 'Al Nile', 'Arial Unicode MS', Arial, sans-serif"
          font-size="130" font-weight="700" fill="#00C8A0" opacity="0.95">س</text>
  </g>

  <!-- WHITE dot at overlap -->
  <circle cx="530" cy="420" r="14" fill="#FFFFFF" opacity="0.95"/>

  <!-- RIGHT teal bubble (in front) -->
  <g>
    <path d="M460,340 h270 q36,0 36,36 v160 q0,36 -36,36 h-10 l12,58 l-54,-58 h-218 q-36,0 -36,-36 v-160 q0,-36 36,-36 z" fill="#00C8A0"/>
    <!-- S in white, large and centered -->
    <text x="600" y="462" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, Helvetica, sans-serif"
          font-size="130" font-weight="700" fill="#FFFFFF">S</text>
  </g>

  <!-- White dot on top layer -->
  <circle cx="530" cy="420" r="13" fill="#FFFFFF"/>
</svg>
